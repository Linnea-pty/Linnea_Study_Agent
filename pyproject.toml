[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "linnea-agent-study"
version = "0.2.0"
description = "Linnea 多模型个人学习 Agent"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.0,<7",
    "langchain>=1.4,<2",
    "langchain-openai>=1.0,<2",
    "langchain-tavily>=0.2,<1",
    "langgraph>=1.0,<2",
    "playwright>=1.50,<2",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
linnea-agent = "linnea_agent.main:run_web"
linnea-agent-cli = "linnea_agent.main:run_cli"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/linnea_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
